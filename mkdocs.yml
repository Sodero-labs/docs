site_name: Sodero Documents
site_url: https://docs.sodero.io/
exclude_docs: |
  overrides/
theme:
  name: material
  favicon: assets/tab_icon.svg
  custom_dir: docs/overrides
  font:
    text: "Inter"
    code: "JetBrains Mono"
  palette:
    - scheme: slate
      primary: black
      accent: white
  features:
    - navigation.path
    - navigation.sections
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share
    
extra:
  version:
    provider: mike
  comments:
    provider: giscus
    options:
      repo: Sodero-labs/docs
      repo_id: R_kgDOQiK7fQ  
      category: Q&A   
      category_id: DIC_kwDOQiK7fc4C3JkV
      mapping: pathname
      strict: 0
      reactions_enabled: 1
      emit_metadata: 0
      input_position: bottom
      theme: dark
      lang: en

extra_css:
  - styles/layout.css
  - styles/color.css
  - styles/font.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/select-all.js
  - javascripts/nav-state.js
  - javascripts/version.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Get Started:
    - Overview: index.md
    - Sodero Ecosystem: get_started/sodero_ecosystem/index.md
    - Key Concepts: get_started/key_concepts/index.md
    - Quick Start: get_started/quick_start/index.md
  - Hardware & Network:
    - Stellar X: hardware_setup/stellar_series/stellar_x/index.md
    - Network Settings: hardware_setup/stellar_series/network_settings/index.md
    - Stop Controls: hardware_setup/stop_controls/index.md
  - Stellar Station:
    - Overview: station/overview/index.md
    - Nodes and Connections: station/nodes_and_connections/index.md
    - Design Documents: station/design_documents/index.md
    - Running Nodes: station/running_nodes/index.md
    - Modules: station/modules/index.md
    - Backup and Restore: station/backup_restore/index.md
  - Stellar Designer:
    - Overview: tutorials/stellar_designer/introduction/index.md
    - Gateway Designer (.gw): gateways/gateway_designer/index.md
    - Manipulator (.sdd): tutorials/stellar_designer/manipulator/index.md
    - Mobile Robot (.sddm): tutorials/stellar_designer/mobile_robot/index.md
    - Articulated Robot (.sdda): tutorials/stellar_designer/articulation/index.md
    - 3D Model (.glb, Optional): tutorials/stellar_designer/3dmodel_creation/index.md
  - Gateways & Sensors:
    - Overview: gateways/overview/index.md
    - EtherCAT Gateway: gateways/ethercat/index.md
    - Simulation Gateway: gateways/simulation/index.md
    - Test Console: gateways/test_console/index.md
    - Sensors and Cameras: gateways/sensors_and_cameras/index.md
    - Device Bridge: gateways/device_bridge/index.md
  - Operate Robots:
    - Strider: controllers/strider/index.md
    - Motion Studio: controllers/motion_studio/index.md
    - Articulation: controllers/articulation/index.md
  - Simulation:
    - Overview: virtual_simulation/introduction/index.md
    - Isaac Bridge Installation: virtual_simulation/extension_installation/index.md
    - Robot Setup: virtual_simulation/robot_setup/index.md
    - Connect to Stellar Station: virtual_simulation/connect_station/index.md
  - Localization & Navigation:
    - Overview: navigation/overview/index.md
    - Load and Configure a Map: navigation/map_bundle/index.md
    - Create a Map from Your Site: navigation/create_map/index.md
  - Tutorials:
    - Learning Path: tutorials/learning_path/index.md
    - Navigate in Simulation: navigation/simulation_tutorial/index.md
    - EtherCAT Mobile Base: tutorials/ethercat_mobile_base/index.md
  - Extend & Automate:
    - SSH Workspace: ssh_workspace/overview/index.md
    - sodero CLI: ssh_workspace/sodero_cli/index.md
    - AI Coding Agents: ssh_workspace/ai_agents/index.md
    - Create Custom Modules: extend/custom_modules/index.md
    - Write Device Bridge Drivers: extend/device_bridge_drivers/index.md
  - Reference:
    - Map Bundle Format: navigation/map_bundle_format/index.md
    - Compatibility and Downloads: reference/compatibility/index.md
    - ChangeLog: CHANGELOG.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - glightbox
  - search
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Get Started:
          - get_started/sodero_ecosystem/index.md
          - get_started/key_concepts/index.md
          - get_started/quick_start/index.md
        Hardware and Network:
          - hardware_setup/**/*.md
        Stellar Station:
          - station/**/*.md
        Stellar Designer:
          - tutorials/stellar_designer/introduction/index.md
          - gateways/gateway_designer/index.md
          - tutorials/stellar_designer/manipulator/index.md
          - tutorials/stellar_designer/mobile_robot/index.md
          - tutorials/stellar_designer/articulation/index.md
          - tutorials/stellar_designer/3dmodel_creation/index.md
        Gateways and Sensors:
          - gateways/overview/index.md
          - gateways/ethercat/index.md
          - gateways/simulation/index.md
          - gateways/test_console/index.md
          - gateways/sensors_and_cameras/index.md
          - gateways/device_bridge/index.md
        Operate Robots:
          - controllers/**/*.md
        Simulation:
          - virtual_simulation/**/*.md
        Localization and Navigation:
          - navigation/overview/index.md
          - navigation/map_bundle/index.md
          - navigation/create_map/index.md
        Tutorials:
          - tutorials/learning_path/index.md
          - navigation/simulation_tutorial/index.md
          - tutorials/ethercat_mobile_base/index.md
        Extend and Automate:
          - ssh_workspace/overview/index.md
          - ssh_workspace/sodero_cli/index.md
          - ssh_workspace/ai_agents/index.md
          - extend/**/*.md
        Reference:
          - navigation/map_bundle_format/index.md
          - reference/**/*.md
