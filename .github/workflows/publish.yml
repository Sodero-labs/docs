name: publish site
on:
  push:
    tags:
      # <product folder>/<version>, for example sodero-cloud/v1.0.0 or stellar-x/v2.0.0
      - 'sodero-cloud/v*'
      - 'stellar-x/v*'
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy with mike
        run: |
          PRODUCT="${GITHUB_REF_NAME%%/*}"
          VERSION="${GITHUB_REF_NAME#*/}"

          # Sync the gh-pages branch
          git fetch origin gh-pages:gh-pages || true

          # Deploy the version under /<product>/ and point the product's latest alias to it
          mike deploy --config-file "$PRODUCT/mkdocs.yml" --push --update-aliases "$VERSION" latest

          # /<product>/ opens the latest version
          mike set-default --config-file "$PRODUCT/mkdocs.yml" --push latest

      - name: Publish the home page
        run: |
          python3 tools/publish_home.py --push
