name: publish site
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy with mike
        run: |
          # Use the pushed tag name as the version name (e.g. v2.0.0)
          TAG_NAME=${GITHUB_REF_NAME}
          
          # Sync the gh-pages branch
          git fetch origin gh-pages:gh-pages || true
          
          # Deploy the tag as a version and point the latest alias to it
          mike deploy --push --update-aliases $TAG_NAME latest
          
          # Make the latest version the default page
          mike set-default --push latest